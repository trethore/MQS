[versions]
mod = "0.0.1"
fabric-loom = "1.17-SNAPSHOT"
fabric-loader = "0.19.3"
junit = "6.1.2"
slf4j = "2.0.7"
gson = "2.13.2"
graal = "25.1.3"
byte-buddy = "1.18.11"
jetbrains-annotations = "26.0.2"
palantir-java-format = "2.97.0"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
graal-collections = { module = "org.graalvm.sdk:collections", version.ref = "graal" }
graal-nativeimage = { module = "org.graalvm.sdk:nativeimage", version.ref = "graal" }
graal-word = { module = "org.graalvm.sdk:word", version.ref = "graal" }
graal-jniutils = { module = "org.graalvm.sdk:jniutils", version.ref = "graal" }
graal-polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "graal" }
graal-truffle-api = { module = "org.graalvm.truffle:truffle-api", version.ref = "graal" }
graal-js-core = { module = "org.graalvm.js:js", version.ref = "graal" }
graal-js-language = { module = "org.graalvm.js:js-language", version.ref = "graal" }
graal-regex = { module = "org.graalvm.regex:regex", version.ref = "graal" }
graal-shadowed-icu4j = { module = "org.graalvm.shadowed:icu4j", version.ref = "graal" }
graal-shadowed-xz = { module = "org.graalvm.shadowed:xz", version.ref = "graal" }
bytebuddy-core = { module = "net.bytebuddy:byte-buddy", version.ref = "byte-buddy" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

[plugins]
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }
