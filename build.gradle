import java.time.Year

plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'com.github.johnrengelman.shadow' version '8.1.1'
	id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()

    maven {
        url = uri("https://maven.pkg.github.com/trethore/Weave")
        credentials {
            username = findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR") ?: System.getenv("GPR_USER")
            password = findProperty("gpr.key")  ?: System.getenv("GITHUB_TOKEN") ?: System.getenv("GPR_TOKEN")
        }
        content { includeGroup("tytoo.minegui") }
    }

	maven { url = uri("https://packages.graalvm.org/maven") }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"my-qol-scripts" {
			sourceSet sourceSets.client
		}
	}
}

project.ext.graalVersion = "25.0.1"
def mineguiVersion = "0.0.3-0.119.4+1.21.4+build.8"

// Configuration used to fetch sources of external dependencies for browsing
configurations {
    vineflower
}

dependencies {
	minecraft          "com.mojang:minecraft:${project.minecraft_version}"
	mappings           "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation  "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation  "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"


    // graalvm my beloved
	shadow(implementation "org.graalvm.sdk:graal-sdk:${graalVersion}")
	shadow(implementation "org.graalvm.truffle:truffle-api:${graalVersion}")
	shadow(implementation "org.graalvm.js:js-language:${graalVersion}")
	shadow(implementation "org.graalvm.js:js-scriptengine:${graalVersion}")
	shadow(implementation "net.bytebuddy:byte-buddy:1.17.6")
	shadow(implementation "net.bytebuddy:byte-buddy-agent:1.17.6")
    shadow(modImplementation "tytoo.minegui:minegui:${mineguiVersion}")

	// Sources for unpack task
    vineflower "org.vineflower:vineflower:1.10.1"
}

tasks.register('applyLicenseHeaders') {
	doLast {
		def headerFile = file('HEADER')
		if (!headerFile.exists()) {
			println "HEADER file not found. Skipping license header application."
			return
		}

		def headerContent = headerFile.getText('UTF-8')
				.replace('<year>', Year.now().getValue().toString())
		def firstHeaderLine = headerContent.readLines().first()

		sourceSets.each { sourceSet ->
			sourceSet.java.srcDirs.each { srcDir ->
				if (!srcDir.exists()) return
				srcDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
					if (file.name.endsWith('.java')) {
						def content = file.getText('UTF-8')
						if (!content.startsWith(firstHeaderLine)) {
							println "Adding license header to: $file.path"
							file.setText(headerContent + '\n\n' + content, 'UTF-8')
						}
					}
				}
			}
		}
	}
}

processResources {
	dependsOn(applyLicenseHeaders)
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		into ""
		rename { "${project.archives_base_name}-LICENSE.txt" }
	}

	manifest {
		attributes(
				'Implementation-Title':       project.name,
				'Implementation-Version':     project.version,
				'Built-By':                   System.getProperty('user.name'),
				'Built-Date':                 new Date(),
				'License':                    "See ${project.archives_base_name}-LICENSE.txt"
		)
	}
}

shadowJar {
	archiveClassifier.set("dev")
	configurations = [project.configurations.shadow]
	from sourceSets.client.output

	from("LICENSE") {
		into "META-INF"
		rename { "${project.archives_base_name}-LICENSE.txt" }
	}

	mergeServiceFiles()
	relocate 'org.graalvm', 'net.me.libs.graalvm'
	relocate 'net.bytebuddy', 'net.me.libs.bytebuddy'
	relocate 'tytoo.minegui', 'net.me.libs.minegui'

	manifest {
		attributes(
				'Implementation-Title':       project.name,
				'Implementation-Version':     project.version,
				'Built-By':                   System.getProperty('user.name'),
				'Built-Date':                 new Date(),
				'License':                    "See ${project.archives_base_name}-LICENSE.txt"
		)
	}
}

tasks.register('shadowLibsJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier.set("libs-only")
    configurations = [project.configurations.shadow]
    dependencies {
        include(dependency("org.graalvm.sdk:graal-sdk"))
        include(dependency("org.graalvm.truffle:truffle-api"))
        include(dependency("org.graalvm.js:js-language"))
        include(dependency("org.graalvm.js:js-scriptengine"))
        include(dependency("net.bytebuddy:byte-buddy"))
        include(dependency("net.bytebuddy:byte-buddy-agent"))
    }
    from({ files() })
    mergeServiceFiles()
    relocate 'org.graalvm', 'net.me.libs.graalvm'
    relocate 'net.bytebuddy', 'net.me.libs.bytebuddy'
}

tasks.register('shadowWeaveJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier.set("weave-dev")
    configurations = [project.configurations.shadow]
    from sourceSets.client.output
    dependencies {
        include(dependency("tytoo.minegui:minegui"))
    }
    mergeServiceFiles()
    relocate 'tytoo.minegui', 'net.me.libs.minegui'
}

remapJar {
    dependsOn(tasks.named('shadowWeaveJar'), tasks.named('shadowLibsJar'))
    inputFile = tasks.named('shadowWeaveJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).get().archiveFile

    from({ zipTree(tasks.named('shadowLibsJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).get().archiveFile.get().asFile) })

    from("LICENSE") {
        into "META-INF"
        rename { "${project.archives_base_name}-LICENSE.txt" }
    }
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		// configure your publish repos here
	}
}

def findWeaveNamedJar = {
    def files = sourceSets.client.runtimeClasspath.files
    def jar = files.find { it.name.endsWith(".jar") && it.name.contains("weave-ui") }
    if (jar == null) {
        throw new GradleException("Could not locate weave-ui jar on client runtimeClasspath.")
    }
    jar
}

tasks.register('decompileWeave', JavaExec) {
    group = "help"
    description = "Decompiles the named Weave jar to readable sources"
    dependsOn configurations.vineflower
    classpath = configurations.vineflower
    mainClass = "org.jetbrains.java.decompiler.main.decompiler.ConsoleDecompiler"
    doFirst {
        def weaveJar = findWeaveNamedJar()
        args = [
                "-dgs=true",
                "-rbr=true",
                "-lit=true",
                "-ind=    ",
                weaveJar.absolutePath,
                file("$buildDir/decompiled/weave-ui").absolutePath
        ]
        println "Decompiling: ${weaveJar}"
    }
}

tasks.register('unpackWeaveSources', Sync) {
    dependsOn 'decompileWeave'
    from "$buildDir/decompiled/weave-ui"
    into "$projectDir/external-dependencies/weave-ui"
}
