import java.time.Year

plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'com.github.johnrengelman.shadow' version '8.1.1'
	id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = uri("https://packages.graalvm.org/maven") }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"my-qol-scripts" {
			sourceSet sourceSets.client
		}
	}
}

project.ext.lwjglVersion  = "3.3.4"
project.ext.lwjglNatives  = "natives-windows"
project.ext.graalVersion  = "24.2.1"

dependencies {
	minecraft          "com.mojang:minecraft:${project.minecraft_version}"
	mappings           "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation  "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation  "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	shadow(implementation "org.graalvm.sdk:graal-sdk:${graalVersion}")
	shadow(implementation "org.graalvm.truffle:truffle-api:${graalVersion}")
	shadow(implementation "org.graalvm.js:js-language:${graalVersion}")
	shadow(implementation "org.graalvm.js:js-scriptengine:${graalVersion}")
	shadow(implementation "net.bytebuddy:byte-buddy:1.17.6")
	shadow(implementation "net.bytebuddy:byte-buddy-agent:1.17.6")
}

tasks.register('applyLicenseHeaders') {
	doLast {
		def headerFile = file('HEADER')
		if (!headerFile.exists()) {
			println "HEADER file not found. Skipping license header application."
			return
		}

		def headerContent = headerFile.getText('UTF-8')
				.replace('<year>', Year.now().getValue().toString())
		def firstHeaderLine = headerContent.readLines().first()

		sourceSets.each { sourceSet ->
			sourceSet.java.srcDirs.each { srcDir ->
				if (!srcDir.exists()) return
				srcDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
					if (file.name.endsWith('.java')) {
						def content = file.getText('UTF-8')
						if (!content.startsWith(firstHeaderLine)) {
							println "Adding license header to: $file.path"
							file.setText(headerContent + '\n\n' + content, 'UTF-8')
						}
					}
				}
			}
		}
	}
}

processResources {
	dependsOn(applyLicenseHeaders)
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		into ""
		rename { "${project.archives_base_name}-LICENSE.txt" }
	}

	manifest {
		attributes(
				'Implementation-Title':       project.name,
				'Implementation-Version':     project.version,
				'Built-By':                   System.getProperty('user.name'),
				'Built-Date':                 new Date(),
				'License':                    "See ${project.archives_base_name}-LICENSE.txt"
		)
	}
}

shadowJar {
	archiveClassifier.set("dev")
	configurations = [project.configurations.shadow]
	from sourceSets.client.output

	from("LICENSE") {
		into "META-INF"
		rename { "${project.archives_base_name}-LICENSE.txt" }
	}

	mergeServiceFiles()
	relocate 'org.graalvm', 'net.me.libs.graalvm'
	relocate 'net.bytebuddy', 'net.me.libs.bytebuddy'

	manifest {
		attributes(
				'Implementation-Title':       project.name,
				'Implementation-Version':     project.version,
				'Built-By':                   System.getProperty('user.name'),
				'Built-Date':                 new Date(),
				'License':                    "See ${project.archives_base_name}-LICENSE.txt"
		)
	}
}

remapJar {
	dependsOn(shadowJar)
	inputFile = tasks.shadowJar.archiveFile

	from("LICENSE") {
		into "META-INF"
		rename { "${project.archives_base_name}-LICENSE.txt" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		// configure your publish repos here
	}
}