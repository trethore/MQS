name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Version to release
        required: true
        type: choice
        default: all
        options:
          - all
          - fabric-1.21.11
      draft:
        description: Create the release as a draft
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      targets: ${{ steps.release.outputs.targets }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: prepare release
        id: release
        env:
          TARGET: ${{ inputs.target }}
        run: ./scripts/release/prepare.sh "$TARGET" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
          cache: gradle

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build ${{ matrix.target }}
        run: ./gradlew ":packages:${{ matrix.target }}:build"

      - name: stage release artifact
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/release/stage-artifact.sh "$TARGET"

      - name: upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: create release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: ./scripts/release/create-notes.sh "$TAG"

      - name: create github release
        env:
          DRAFT: ${{ inputs.draft }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: ./scripts/release/publish.sh "$TAG" "$DRAFT"
